<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="header">
        <h1>THIS IS A BASIC WEATHER APP</h1>
    </div>
    #this div is for the search box and button
    <div class="search">
        <input type="text" id="cityInput" placeholder="Enter a City">
         <button id="searchbutton"> Search </button>
    </div>
    #this div is where the information will be presented
    <div id="weather">
        <h2 id="city"></h2>
        <p id="temperature"></p>
        <p id="condition"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
