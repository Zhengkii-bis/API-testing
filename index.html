<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="header">
        <h2>WHAT'S MY WEATHER</h2>
    </div>
    <!-- this div is for the search box and button -->
    <div class="search">
        <input type="text" id="cityInput" placeholder="Enter a City">
         <button id="searchbutton"> Search </button>
    </div>
    <!-- his div is where the information will be presented -->
    <div id="weather">
        <h2 id="city"></h2>
        <p id="coordinates"></p>
        <p id="is_day"></p>
        <p id="precipitation"></p>
        <p id="rainchance"></p>
        <p id="temperature"></p>
        <p id="humidity"></p>     
        <p id="condition"></p>
        <button id="backbutton" style="display:none;">New Search</button>
    </div>
    <div id="footing">
        <h3>Made by Jayson Simballa</h3>
        <p>Version 2.3</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
