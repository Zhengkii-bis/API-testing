<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header">
        <h2>WHAT'S MY WEATHER</h2>
    </div>
    <div class="hero">
     <video id="hero-video" autoplay muted loop playsinline>
        <source src="Assets/hero-video.mp4" type="video/mp4">
        </video>
        <div id="hero-text">
        <h2 >KNOW YOUR WEATHER<br> WITH WHAT'S YOUR WEATHER!</h2>
        <p>The reliable go-to weather tracker in the country!</p>
     </div>
    </div>
    <!-- this div is for the search box and button -->
    <div class="search">
        <input type="text" id="cityInput" placeholder="Enter a City">
        <button id="searchbutton"> Search </button>
    </div>

    <!-- his div is where the information will be presented -->
    <div id="weather">
        <h2 id="city"></h2>
        <p id="coordinates"></p>
        <p id="is_day"></p>
        <p id="precipitation"></p>
        <p id="rainchance"></p>
        <p id="temperature"></p>
        <p id="humidity"></p>     
        <p id="condition"></p>
        <button id="backbutton" style="display:none;">New Search</button>
    </div>

    <div id="footing">
        <h3>Made by Jayson Simballa</h3>
        <p>Version 2.3</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
